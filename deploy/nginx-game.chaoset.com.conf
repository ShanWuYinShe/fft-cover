# game.chaoset.com — 前端游戏集合（静态）
# 新增游戏：sites/ 下放 <game>/ 目录，并复制一个 server 块改 root/server_name

# 容器内探活端点（compose healthcheck 用；与 media/music/workwork 站惯例一致，
# 只绑容器回环，不经公网）
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    access_log off;

    location = /nginx-health {
        return 204;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name game.chaoset.com;

    ssl_certificate     /etc/nginx/certs/chaoset.pem;
    ssl_certificate_key /etc/nginx/certs/chaoset.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Cloudflare Authenticated Origin Pulls（mTLS）——与全站一致：
    # CF 回源出示客户端证书放行，绕过 CF 直连源站被 400 拒绝。
    # pem 为 CF 公开发布的 origin-pull CA（归档
    # ~/work/dogod/cf_token_and_cert/cloudflare-origin-pull-ca.pem），不入库。
    ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull.pem;
    ssl_verify_client on;

    root /var/www/fft-cover;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 指纹资源长缓存(缺失显式 404,不落 SPA fallback)
    location /assets/ {
        expires 30d;
        add_header Cache-Control 'public, immutable';
        try_files $uri =404;
    }

    # Service Worker 与入口 HTML 不缓存（SW 文件名已带版本，双保险）
    location ~ ^/sw(-[0-9A-Za-z]+)?\.js$ {
        add_header Cache-Control 'no-cache, must-revalidate';
    }

    # 无鉴权存活探针（web-service-conventions）
    location = /healthz {
        default_type application/json;
        alias /var/www/fft-cover/version.json;
        add_header Cache-Control 'no-store';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 集合站子路径游戏 ──
    # 静态目录 sites/<game>/（compose 挂 sites → /var/www），构建时以对应
    # 子路径为 base（Vite: VITE_BASE=/travel/ 或 vite build --base=/cnm/）。
    # fft-cover 保持根路径，存量 URL/SW 缓存不受影响。
    # 无尾斜杠 301 到带斜杠路径，避免落入根游戏的 SPA fallback。
    # 用 root（非 alias）：URI 第一段与目录名一致，/cnm/x → /var/www/cnm/x，
    # 且嵌套 location 可继承 root；alias 的 try_files 拼接是著名坑。
    # 资源类扩展名 404 保持 404、不落 SPA fallback——缺失文件返回 index.html
    # 会把 HTML 塞给 JSON/图片加载器（实测 PixiJS Assets.load 拿到 HTML 后
    # 启动挂死，#boot 永不移除）；SPA fallback 只服务页面路由。
    location = /travel { return 301 /travel/; }
    location ^~ /travel/ {
        root /var/www;
        index index.html;
        location ~* \.(json|png|jpe?g|webp|gif|svg|ico|wav|mp3|ogg|m4a|woff2?|wasm|map)$ {
            try_files $uri =404;
        }
        try_files $uri $uri/ /travel/index.html;
    }

    location = /cnm { return 301 /cnm/; }
    location ^~ /cnm/ {
        root /var/www;
        index index.html;
        location ~* \.(json|png|jpe?g|webp|gif|svg|ico|wav|mp3|ogg|m4a|woff2?|wasm|map)$ {
            try_files $uri =404;
        }
        try_files $uri $uri/ /cnm/index.html;
    }

    location = /wave-warden { return 301 /wave-warden/; }
    location ^~ /wave-warden/ {
        root /var/www;
        index index.html;
        location ~* \.(json|png|jpe?g|webp|gif|svg|ico|wav|mp3|ogg|m4a|woff2?|wasm|map)$ {
            try_files $uri =404;
        }
        try_files $uri $uri/ /wave-warden/index.html;
    }
}
