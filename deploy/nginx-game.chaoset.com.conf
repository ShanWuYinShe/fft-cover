# game.chaoset.com — 前端游戏集合（静态）
# 新增游戏：sites/ 下放 <game>/ 目录，并复制一个 server 块改 root/server_name

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name game.chaoset.com;

    ssl_certificate     /etc/nginx/certs/chaoset.pem;
    ssl_certificate_key /etc/nginx/certs/chaoset.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/fft-cover;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 指纹资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control 'public, immutable';
    }

    # Service Worker 与入口 HTML 不缓存（SW 文件名已带版本，双保险）
    location ~ ^/sw(-[0-9A-Za-z]+)?\.js$ {
        add_header Cache-Control 'no-cache, must-revalidate';
    }

    # 无鉴权存活探针（web-service-conventions）
    location = /healthz {
        default_type application/json;
        alias /var/www/fft-cover/version.json;
        add_header Cache-Control 'no-store';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
